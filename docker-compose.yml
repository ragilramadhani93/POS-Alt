version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pos_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pos_password_secure
      POSTGRES_DB: pos_alternatif
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Fast State
  redis:
    image: redis:7-alpine
    container_name: pos_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # 3. NestJS Backend REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:pos_password_secure@postgres:5432/pos_alternatif?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: pos_super_secret_jwt_key_2026_indonesia
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: pos_super_secret_refresh_key_2026_indonesia
      JWT_REFRESH_EXPIRES_IN: 7d
    ports:
      - "3000:3000"

  # 4. Next.js 15 Web Dashboard (Head Office)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: pos_dashboard
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3001"

volumes:
  pgdata:
  redisdata:
